# Reçoit les métriques du pipeline (scipulse.common.monitoring.emit) et les indexe pour Kibana
input {
  http {
    port => 8080
    codec => json
    ecs_compatibility => disabled
  }
}

filter {
  # Selon l'en-tête Content-Type, le corps peut arriver brut dans `message` : on le décode ici
  if [message] and [message] =~ /^\s*\{/ {
    json {
      source => "message"
      remove_field => ["message"]
    }
  }
  mutate {
    remove_field => ["headers", "host", "url", "user_agent", "http", "@version", "event.original"]
    convert => { "records" => "integer" "success_pct" => "float" "evaluated" => "integer" "successful" => "integer" }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "pipeline-monitoring"
  }
}
